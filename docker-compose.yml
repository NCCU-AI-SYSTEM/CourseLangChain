services:
  postgres:
    build:
      context: .
      dockerfile: db/Dockerfile
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: academic
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d academic"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d

  populator:
    build:
      context: .
      dockerfile: populator/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/academic
    restart: no

  embedder:
    build:
      context: ./embedder
      dockerfile: Dockerfile
    depends_on:
      populator:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/academic
      MODEL_NAME: google/embeddinggemma-300m
      HF_TOKEN: ${HF_TOKEN}
    restart: no

volumes:
  pgdata:
