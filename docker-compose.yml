services:
  courselanggraph:
    build:
      args:
        PROJECT_PATH: /course-langchain
      context: .
      dockerfile: Dockerfile
    environment:
      - OLLAMA_HOST=${OLLAMA_HOST}
      - MODEL=${MODEL}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY}
      - LANGFUSE_BASE_URL=${LANGFUSE_BASE_URL}
      - USE_GOOGLE_AI=${USE_GOOGLE_AI}
    ports:
      - "8000:8000"
    # data.db / vectorstore.pkl 被 .dockerignore 排除(太大,不烤進 image),
    # 改在 runtime 掛載進容器;否則容器內無此檔 → no such table: COURSE / 找不到向量庫
    volumes:
      - ./data.db:/course-langchain/data.db
      - ./vectorstore.pkl:/course-langchain/vectorstore.pkl
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    command: ["bash", "-c", "python app.py"]
