# Data contract — describes what a prepared artifact contains.
#
# Authored in course-data-prep and shipped alongside the .sql.gz. The consuming
# repo keeps a byte-for-byte copy: edit it there and the copy silently diverges
# from the data it is supposed to describe.
#
# What belongs here: properties of the DATA. Change one and existing artifacts
# become wrong or incomparable.
#
# What does NOT belong here: anything about a particular machine — database
# location, model host, credentials, which device embedding runs on. Those come
# from the environment (DATABASE_URL, EMBED_DEVICE) or .env.
#
# Nothing here is overridable by an environment variable, on purpose: a setting
# should have exactly one source.
#
# prep.migrate writes these values into the database's schema_meta table, so they
# travel inside the artifact. The consumer compares its copy against schema_meta
# at startup and refuses to serve on a mismatch.

# Bump when init-scripts change the table structure.
schema_version: 8

# The embedding model. Queries are encoded with this same model, so a mismatch
# makes vectors incomparable — retrieval would not error, just rank nonsense.
embed_model: BAAI/bge-base-zh-v1.5
embed_dim: 768

# Deprecated: only the old SQLite/FAISS path uses this.
sqlite_embed_model: BAAI/bge-m3

# The semester the artifact contains. Retrieval, course detail and scheduling
# all scope to it.
course_year: "115"
course_semester: "1"
